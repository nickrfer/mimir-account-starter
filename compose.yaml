services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mimir
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d mimir']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      target: runtime
    env_file: ['${MIMIR_CONFIG_DIR:-.}/.env.runtime']
    environment:
      ALLOW_LOCAL_HTTP: '${MIMIR_ALLOW_LOCAL_HTTP:-true}'
      APP_ORIGINS: '${MIMIR_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:5173,http://localhost:5173}'
    ports: ['127.0.0.1:${MIMIR_HTTP_PORT:-3000}:3000']
    networks: [database, frontend]
    depends_on:
      db: { condition: service_healthy }
    init: true
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=192m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  admin:
    profiles: [tools]
    build:
      context: .
      target: admin
    env_file: ['${MIMIR_CONFIG_DIR:-.}/.env.admin']
    networks: [database]
    depends_on:
      db: { condition: service_healthy }
    command: [migrate]
  dev-web:
    profiles: [dev]
    build:
      context: .
      target: development
    environment:
      MIMIR_WATCH_POLLING: '${MIMIR_WATCH_POLLING:-true}'
    ports: ['127.0.0.1:${MIMIR_VITE_PORT:-5173}:5173']
    volumes:
      - ./apps/web/src:/app/apps/web/src:ro
      - ./apps/web/index.html:/app/apps/web/index.html:ro
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts:ro
    networks: [frontend]
    depends_on: [api]
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  verifier:
    profiles: [tools]
    build:
      context: .
      target: verifier
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
secrets:
  postgres_password:
    file: '${MIMIR_CONFIG_DIR:-.}/.local/postgres-password'
volumes:
  pgdata:
networks:
  database:
    internal: true
  frontend:
